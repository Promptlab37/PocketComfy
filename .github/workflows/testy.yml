# Jednotkové testy při každém pushi. Bez local.properties se release
# nepodepisuje a testy závislé na místním ComfyUI se přeskočí (TestCesty),
# takže tady běží jen to, co je čistě v kódu – buildery, překlady, šablony.
name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Jednotkové testy
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon --console=plain
      - name: Výsledky testů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vysledky-testu
          path: app/build/test-results/testDebugUnitTest/
